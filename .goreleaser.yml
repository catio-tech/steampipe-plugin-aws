# GoReleaser config for Steampipe OCI packaging (GHCR).
# Binaries are published as gzip layers by .github/workflows/registry-publish.yml.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: steampipe
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
      - GOPRIVATE=github.com/turbot
    # Match the Steampipe image (linux/amd64 only). Bundle bake and EKS
    # never need darwin or arm64 layers.
    goos:
      - linux
    goarch:
      - amd64
    binary: "{{ .ProjectName }}.plugin"
    flags:
      - -tags=netgo

archives:
  - formats: [gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: true

project_name: steampipe-plugin-aws
