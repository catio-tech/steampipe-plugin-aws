name: Development Workflow

on:
  push:
    branches: ["main"]
  # Device42 registry-publish dispatches this after retagging GHCR :latest so
  # the Steampipe image picks up the new plugin without a Dockerfile edit.
  repository_dispatch:
    types: [device42-plugin-released]
  workflow_dispatch:

env:
  AWS_REGION: "us-west-2"
  AWS_ACCOUNT_ID: "891377056770"
  DEVICE42_GHCR_REF: "ghcr.io/catio-tech/device42:latest"

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set Git Commit SHA
        id: vars
        run: echo "GIT_COMMIT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Docker config for private ghcr.io/catio-tech/* Steampipe plugins.
      # Mounted as BuildKit secret `docker_config` — not baked into the image.
      # Do not point DOCKER_CONFIG at this dir for `docker buildx` — that hides
      # CLI plugins under ~/.docker/cli-plugins.
      - name: Prepare GHCR docker config
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$GHCR_TOKEN" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH" > "$RUNNER_TEMP/ghcr-docker-config.json"

      # Resolve :latest → digest via the registry API (not `docker buildx`), so
      # DEVICE42_CACHEBUST changes whenever the Device42 package moves.
      - name: Resolve Device42 GHCR digest
        id: device42
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ghcr.io/catio-tech/device42:latest → repo path + tag
          REPO="${DEVICE42_GHCR_REF#ghcr.io/}"
          TAG="${REPO##*:}"
          NAME="${REPO%:*}"
          PULL_TOKEN="$(curl -fsSL \
            -u "x-access-token:${GHCR_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${NAME}:pull" \
            | jq -r .token)"
          test -n "$PULL_TOKEN" && test "$PULL_TOKEN" != null
          DIGEST="$(curl -fsSI \
            -H "Authorization: Bearer ${PULL_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${NAME}/manifests/${TAG}" \
            | tr -d '\r' \
            | awk 'tolower($1)=="docker-content-digest:" {print $2; exit}')"
          test -n "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Device42 ${DEVICE42_GHCR_REF} → ${DIGEST}"

      - name: Build and push steampipe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/steampipe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/steampipe:${{ env.GIT_COMMIT_SHA }}
          build-args: |
            DEVICE42_CACHEBUST=${{ steps.device42.outputs.digest }}
          secret-files: |
            docker_config=${{ runner.temp }}/ghcr-docker-config.json
