name: Lint and Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not go-version-file: go.mod's 1.26.8 predates the eMudhra CA distrust fix
          go-version: "1.26.10"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=20m

      - name: Run unit tests
        run: go test ./... -timeout 15m
